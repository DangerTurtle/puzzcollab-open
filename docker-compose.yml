services:
  tap:
    image: ghcr.io/bluesky-social/indigo/tap:latest
    command: ["/tap", "run", "--no-replay"]
    ports:
      - "127.0.0.1:2480:2480"
    volumes:
      - ./.tap-data:/data
    environment:
      # Reaches the Next.js dev server running on the host from inside the container.
      TAP_WEBHOOK_URL: ${TAP_WEBHOOK_URL:-http://host.docker.internal:3000/api/webhook}
      # No TAP_SIGNAL_COLLECTION: we deliberately don't auto-discover every
      # account that ever writes a us.puzzling.* record anywhere on the
      # network. Repos are registered explicitly via /repos/add (see
      # lib/tap/registerRepos) at the moment a DID becomes relevant to us --
      # joining a team -- so Tap only ever tracks real puzzling.us members.
      # Filtering still applies to whichever repos ARE tracked, so we don't
      # get flooded with e.g. app.bsky.feed.post from the same accounts.
      TAP_COLLECTION_FILTERS: us.puzzling.*
      # Must be set in a local .env, not committed here -- see env.template.
      TAP_ADMIN_PASSWORD: ${TAP_ADMIN_PASSWORD}
